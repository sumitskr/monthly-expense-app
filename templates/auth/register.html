{% extends 'base.html' %}

{% block title %}Register - CashFlowPro{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="glass-card">
    <div class="auth-header">
      <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2>Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Track salary, EMIs, savings & available cash</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="full_name"><i class="fa-solid fa-user"></i> Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Sumit Kumar" required autofocus>
      </div>

      <div class="form-group">
        <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
        <small style="color: var(--text-dim); font-size: 0.775rem;">We will send a 6-digit verification OTP to this email.</small>
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-key"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required>
      </div>

      <div class="form-group">
        <label for="confirm_password"><i class="fa-solid fa-check-double"></i> Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        <i class="fa-solid fa-paper-plane"></i> Register & Send OTP
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('login') }}" style="font-weight: 700;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
